<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>OpsFlow — Map How Work Gets Done</title>
<meta name="description" content="Free workflow designer. Drag steps onto a canvas, connect them with arrows, record who does each step, the tool and the time, and share it with a link. Runs in your browser; nothing is uploaded.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Bright and clean: white surfaces, system colours, square corners. */
  :root{
    --paper:#F5F5F7;
    --panel:#FFFFFF;
    --ink:#1D1D1F;
    --ink-soft:#6E6E73;
    --ink-faint:#A1A1A6;
    --rule:#E2E2E7;
    --fill:#EDEDF0;
    --accent:#007AFF;
    --red:#FF3B30;
    --stripes:linear-gradient(90deg,#34C759 0 16.6%,#FFCC00 0 33.3%,#FF9500 0 50%,#FF3B30 0 66.6%,#AF52DE 0 83.3%,#007AFF 0);
  }
  *{box-sizing:border-box;border-radius:0;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
  body{height:100dvh;-webkit-tap-highlight-color:transparent;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',-apple-system,'SF Pro Text','Segoe UI',sans-serif;font-size:14px;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;}
  button,select,input,textarea{font:inherit;color:var(--ink);}
  button,.btn{background:var(--fill);border:0;padding:8px 10px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
    transition:background .12s,color .12s;}
  button:hover,.btn:hover{background:#DEDEE3;}
  button:active,.btn:active{background:#D2D2D7;}
  button:disabled{opacity:.3;pointer-events:none;}
  button.primary{background:var(--accent);color:#fff;font-weight:600;padding:10px;}
  button.primary:hover{background:#0A6FE0;}
  button.danger{color:var(--red);}
  button.danger:hover{background:var(--red);color:#fff;}
  select,input,textarea{background:var(--panel);border:1px solid #D2D2D7;padding:7px 9px;font-size:13px;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.2);}
  button:focus-visible,.btn:focus-within{outline:3px solid rgba(0,122,255,.45);outline-offset:1px;}
  #wfName{font-weight:700;font-size:20px;letter-spacing:-.02em;background:transparent;border:0;border-bottom:2px solid transparent;padding:0 0 4px;}
  #wfName:hover{border-bottom-color:var(--rule);}
  #wfName:focus{border-bottom-color:var(--accent);box-shadow:none;}
  #fileIn{display:none!important;}
  label.btn{display:inline-block;font-size:13px;font-weight:500;margin:0;color:var(--ink);text-align:center;}
  main{position:relative;flex:1;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:0;--sbw:280px;}
  main.collapsed{grid-template-columns:0 minmax(0,1fr);}
  .sidebar{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--panel);border-right:1px solid var(--rule);}
  main.collapsed .sidebar{visibility:hidden;border-right:0;}
  .sbHead{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 10px 14px 16px;flex:none;}
  .sbHead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--stripes);}
  .name{font-size:15px;font-weight:700;letter-spacing:-.01em;}
  .sbBody{flex:1;overflow-y:auto;overflow-x:hidden;width:var(--sbw);max-width:100%;counter-reset:sec;scrollbar-width:thin;scrollbar-color:#C7C7CC transparent;}
  .sbFoot{flex:none;padding:10px 16px;border-top:1px solid var(--rule);font-size:13px;}
  .sbFoot a{color:var(--accent);text-decoration:none;font-weight:500;}
  .sbFoot a:hover{text-decoration:underline;}
  .sbBtn{padding:4px 9px;font-size:14px;line-height:1.2;background:transparent;color:var(--ink-soft);}
  #sbOpen{position:absolute;left:12px;top:12px;z-index:5;display:none;background:var(--panel);border:1px solid var(--rule);font-size:13px;padding:8px 12px;}
  #sbOpen:hover{background:var(--fill);}
  main.collapsed #sbOpen{display:block;}
  .panel{padding:16px 16px 18px;border-bottom:1px solid var(--rule);counter-increment:sec;--c:var(--accent);}
  .panel:last-child{border-bottom:0;}
  .panel:nth-child(1){--c:#007AFF;} .panel:nth-child(2){--c:#34C759;} .panel:nth-child(3){--c:#FF9500;}
  .panel:nth-child(4){--c:#FF2D55;} .panel:nth-child(5){--c:#AF52DE;}
  .sidebar h2{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;}
  .panel > h2:first-child::before{content:counter(sec);display:inline-grid;place-items:center;width:20px;height:20px;margin-right:9px;
    background:var(--c);color:#fff;font-size:12px;font-weight:700;}
  .panel > h2:not(:first-child){color:var(--ink-soft);font-weight:500;font-size:12px;margin-bottom:6px;}
  .sidebar input,.sidebar select{width:100%;}
  .sidebar .row button,.sidebar .row .btn{flex:1 1 0;}
  .stack{display:flex;flex-direction:column;gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .palGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .pal{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);
    font-size:11px;font-weight:500;color:var(--ink-soft);cursor:grab;touch-action:none;user-select:none;transition:background .12s,transform .12s;}
  .pal:hover{background:var(--fill);color:var(--ink);transform:translateY(-2px);}
  .pal svg{display:block;}
  .canvasWrap{position:relative;min-width:0;min-height:0;}
  #cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:default;}
  #cv.panning{cursor:grabbing;}
  .zoom{position:absolute;right:12px;top:12px;display:flex;background:var(--panel);border:1px solid var(--rule);box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .zoom button{background:transparent;border-right:1px solid var(--rule);padding:7px 12px;font-size:13px;}
  .zoom button:hover{background:var(--fill);}
  .zoom button:last-child{border-right:0;}
  #zFit{color:var(--accent);font-weight:600;}
  #bDark[aria-pressed="true"]{background:var(--ink);color:#fff;}
  /* right-click menu: the same details as the sidebar, at the pointer */
  .ctx{position:fixed;z-index:30;width:250px;max-height:calc(100vh - 16px);overflow-y:auto;display:none;padding:14px;
    background:var(--panel);border:1px solid var(--rule);border-top:4px solid var(--accent);box-shadow:0 14px 44px rgba(0,0,0,.22);}
  .ctx.show{display:block;}
  .ctx h2{font-size:13px;font-weight:600;margin:0 0 10px;}
  .ctx input,.ctx select{width:100%;}
  .ctx .row button{flex:1 1 0;}
  .zoom .gap{width:6px;border-right:1px solid var(--rule);background:var(--paper);}
  .toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;font-size:13px;max-width:70%;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;}
  .toast.show{opacity:1;}
  /* title block in the corner of the sheet */
  .tblock{position:absolute;right:12px;bottom:12px;display:flex;background:var(--panel);border:1px solid var(--rule);border-top:4px solid transparent;
    border-image:var(--stripes) 1;border-image-width:4px 0 0 0;box-shadow:0 2px 10px rgba(0,0,0,.05);max-width:calc(100% - 24px);pointer-events:none;}
  .tblock div{padding:7px 14px 8px;border-right:1px solid var(--rule);min-width:0;}
  .tblock div:last-child{border-right:0;}
  .tblock span{display:block;font-size:11px;color:var(--ink-soft);}
  .tblock b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;}
  label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:10px;}
  label input,label textarea,label select{display:block;width:100%;margin-top:4px;font-weight:400;}
  textarea{resize:vertical;min-height:60px;}
  .muted{color:var(--ink-soft);font-size:13px;line-height:1.5;margin:0;}
  .stat{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--rule);}
  .stat:last-of-type{border-bottom:0;}
  .stat b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .dot{display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:baseline;}
  .row{display:flex;gap:6px;flex-wrap:wrap;}
  .drop{position:fixed;inset:0;z-index:50;background:rgba(245,245,247,0.94);display:none;align-items:center;justify-content:center;font-size:20px;font-weight:600;border:4px dashed var(--accent);}
  .drop.show{display:flex;}
  @media (max-width:900px){
    main,main.collapsed{grid-template-columns:minmax(0,1fr);--sbw:min(88vw,320px);}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sbw);z-index:20;transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.18);}
    main.collapsed .sidebar{transform:translateX(-104%);visibility:hidden;transition:transform .2s,visibility 0s .2s;}
    .tblock div:first-child{display:none;}
    .zoom #zOut,.zoom #zIn,.zoom #zOut + #zIn + #zFit + .gap{display:none;} /* pinch to zoom instead */
    .zoom #zFit{border-right:0;}
    .zoom #bDark{border-left:1px solid var(--rule);}
    .scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.35);}
    main:not(.collapsed) .scrim{display:block;}
  }
  .scrim{display:none;}
  #selEdit{position:absolute;left:12px;bottom:12px;z-index:4;display:none;padding:12px 18px;font-size:15px;box-shadow:0 6px 20px rgba(0,122,255,.35);}
  /* phones: the shape menu becomes a sheet across the top, where the keyboard cannot cover it */
  @media (max-width:600px){
    .ctx{left:0!important;top:0!important;width:100%;max-height:62dvh;border-left:0;border-right:0;padding:14px 16px 16px;}
    .ctx textarea{min-height:44px;height:44px;}
    .ctx label{margin-bottom:8px;}
    .toast{max-width:92%;top:64px;}
  }
  /* fingers: bigger targets, and 16px inputs so iPhones do not zoom the page on focus */
  @media (pointer:coarse){
    button,.btn{min-height:44px;font-size:15px;}
    label.btn{line-height:28px;}
    select,input,textarea{font-size:16px;min-height:44px;}
    #wfName{font-size:20px;}
    .zoom button,.sbBtn{min-width:46px;font-size:16px;}
    .pal{padding:14px 0 10px;font-size:12px;}
    .stat{padding:9px 0;}
  }
  @media print{
    .sidebar,#sbOpen,.zoom,.toast{display:none!important;}
    main,main.collapsed{display:block;}
    body{background:#fff;overflow:visible;height:auto;}
    .canvasWrap{height:95vh;}
  }
</style>
</head>
<body>
<main id="app">
  <aside class="sidebar" id="sidebar" aria-label="Workflow tools">
    <div class="sbHead">
      <span class="name">OpsFlow</span>
      <button id="sbClose" class="sbBtn" aria-label="Collapse sidebar" title="Collapse sidebar  ( [ )">«</button>
    </div>
    <div class="sbBody">
      <section class="panel">
        <h2>Workflow</h2>
        <div class="stack">
          <input id="wfName" aria-label="Workflow name" maxlength="80">
          <select id="wfList" aria-label="Open a workflow or start from a template"></select>
          <div class="row">
            <button id="bNew">New</button>
            <button id="bDup">Copy</button>
            <button id="bDel" class="danger">Delete</button>
          </div>
        </div>
      </section>
      <section class="panel">
        <h2>Add</h2>
        <div class="palGrid">
          <div class="pal" data-type="start"><svg width="40" height="22"><rect x="1" y="3" width="38" height="16" fill="#34C759"/></svg>Start</div>
          <div class="pal" data-type="step"><svg width="40" height="22"><rect x="1" y="3" width="38" height="16" fill="#007AFF"/></svg>Step</div>
          <div class="pal" data-type="decision"><svg width="40" height="22"><polygon points="20,1 39,11 20,21 1,11" fill="#FF9500"/></svg>Decide</div>
          <div class="pal" data-type="end"><svg width="40" height="22"><rect x="1" y="3" width="38" height="16" fill="#FF3B30"/></svg>End</div>
        </div>
      </section>
      <div class="panel" id="details"></div>
      <div class="panel" id="summary"></div>
      <section class="panel">
        <h2>Share</h2>
        <div class="stack">
          <button id="bShare" class="primary">Copy share link</button>
          <div class="grid2">
            <button id="bPng">Picture</button>
            <button id="bPrint">Print</button>
            <button id="bSave">Save file</button>
            <label class="btn">Open file<input id="fileIn" type="file" accept=".json,application/json" hidden></label>
          </div>
        </div>
      </section>
    </div>
    <div class="sbFoot"><a href="https://custombiztools.online">← All tools</a></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="canvasWrap">
    <button id="selEdit" class="primary">Edit</button>
    <button id="sbOpen" aria-label="Open sidebar" title="Open sidebar  ( [ )">☰ Tools</button>
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><rect id="gridDot" x="0" y="0" width="1.4" height="1.4" fill="rgba(29,29,31,0.16)"/></pattern>
        <pattern id="grid2" width="100" height="100" patternUnits="userSpaceOnUse"><path id="gridLine" d="M100.5 0V100.5H0" fill="none" stroke="rgba(29,29,31,0.05)"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path id="arrowPath" d="M0,0 L10,5 L0,10 z" fill="#48484A"/></marker>
        <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007AFF"/></marker>
      </defs>
      <g id="world">
        <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid2)"/>
        <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
        <g id="edgeLayer"></g>
        <g id="nodeLayer"></g>
        <line id="tempLine" stroke="#007AFF" stroke-width="2" stroke-dasharray="5 4" visibility="hidden"/>
      </g>
    </svg>
    <div class="toast" id="toast"></div>
    <div class="zoom">
      <button id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button id="bRedo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
      <span class="gap"></span>
      <button id="zOut" aria-label="Zoom out">−</button>
      <button id="zIn" aria-label="Zoom in">+</button>
      <button id="zFit">Fit</button>
      <span class="gap"></span>
      <button id="bDark" title="Dark canvas" aria-label="Dark canvas" aria-pressed="false">☾</button>
    </div>
    <div class="tblock" aria-hidden="true">
      <div><span>Workflow</span><b id="tbName"></b></div>
      <div><span>Steps</span><b id="tbSteps"></b></div>
      <div><span>Total time</span><b id="tbTime"></b></div>
    </div>
  </div>
</main>
<div class="ctx" id="ctx" role="dialog" aria-label="Shape options"></div>
<div class="drop" id="drop">Drop a workflow file to open it</div>

<script>
// ==LOGIC==
const LIMITS = { nodes: 300, edges: 600, text: 200, notes: 2000, name: 80 };
const SIZE = { start:{w:140,h:48}, end:{w:140,h:48}, step:{w:180,h:64}, decision:{w:150,h:92} };
const TYPES = Object.keys(SIZE);
const OWNER_COLORS = ['#007AFF','#AF52DE','#FF2D55','#30B0C7','#5856D6','#FF9500','#00C7BE','#A2845E'];

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function snap(v, g){ g = g || 20; return Math.round(v / g) * g; }
function emptyWorkflow(name){ return { v:1, name: name || 'Untitled workflow', nodes:[], edges:[] }; }

function str(v, max){ return typeof v === 'string' ? v.slice(0, max) : ''; }
function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }

// Untrusted input (share links, files) -> clean workflow, or throws.
function validate(obj){
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('Not a workflow');
  if (!Array.isArray(obj.nodes)) throw new Error('Not a workflow');
  if (obj.nodes.length > LIMITS.nodes) throw new Error('Too many steps (max ' + LIMITS.nodes + ')');
  // Arrows can come as an "edges" list, or as "next" on each node (easier to write by hand or by an agent).
  const rawEdges = Array.isArray(obj.edges) ? obj.edges.slice(0, LIMITS.edges + 1) : [];
  let loose = false; // any node without a position -> lay the whole thing out
  const ids = new Set();
  const nodes = [];
  for (const n of obj.nodes){
    if (!n || typeof n !== 'object') continue;
    const id = str(n.id, 40) || uid();
    if (ids.has(id)) continue;
    ids.add(id);
    if (typeof n.x !== 'number' || typeof n.y !== 'number') loose = true;
    if (Array.isArray(n.next)) for (const t of n.next.slice(0, 20))
      rawEdges.push(t && typeof t === 'object' ? { from:id, to:t.to, label:t.label } : { from:id, to:t });
    nodes.push({
      id, type: TYPES.includes(n.type) ? n.type : 'step',
      x: Math.max(-19000, Math.min(19000, num(n.x))), y: Math.max(-19000, Math.min(19000, num(n.y))),
      title: str(n.title, LIMITS.text), owner: str(n.owner, LIMITS.text), tool: str(n.tool, LIMITS.text),
      mins: Math.max(0, Math.min(100000, num(n.mins))), notes: str(n.notes, LIMITS.notes)
    });
  }
  if (rawEdges.length > LIMITS.edges) throw new Error('Too many arrows (max ' + LIMITS.edges + ')');
  const edges = [], seen = new Set();
  for (const e of rawEdges){
    if (!e || typeof e !== 'object') continue;
    const from = str(e.from, 40), to = str(e.to, 40);
    if (!ids.has(from) || !ids.has(to) || from === to) continue;
    const key = from + '>' + to;
    if (seen.has(key)) continue;
    seen.add(key);
    edges.push({ id: str(e.id, 40) || uid(), from, to, label: str(e.label, 40) });
  }
  const out = { v:1, name: str(obj.name, LIMITS.name) || 'Untitled workflow', nodes, edges };
  if (loose) autoLayout(out);
  return out;
}
// Top-to-bottom layout: each shape sits one row below the shape that first leads to it.
function autoLayout(wf){
  const depth = new Map(), out = new Map();
  for (const e of wf.edges){ if (!out.has(e.from)) out.set(e.from, []); out.get(e.from).push(e.to); }
  const hasIn = new Set(wf.edges.map(e => e.to));
  let roots = wf.nodes.filter(n => n.type === 'start' || !hasIn.has(n.id)).map(n => n.id);
  if (!roots.length && wf.nodes.length) roots = [wf.nodes[0].id];
  const q = [];
  for (const r of roots) if (!depth.has(r)){ depth.set(r, 0); q.push(r); }
  while (q.length){
    const id = q.shift();
    for (const t of (out.get(id) || [])) if (!depth.has(t)){ depth.set(t, depth.get(id) + 1); q.push(t); }
  }
  const rows = new Map();
  for (const n of wf.nodes){ const d = depth.get(n.id) || 0; if (!rows.has(d)) rows.set(d, []); rows.get(d).push(n); }
  for (const [d, row] of rows) row.forEach((n, i) => { n.x = snap((i - (row.length - 1) / 2) * 260); n.y = d * 140; });
  return wf;
}

function addNode(wf, type, x, y){
  const n = { id: uid(), type, x: snap(x), y: snap(y),
    title: {start:'Start', end:'Done', step:'New step', decision:'Approved?'}[type] || 'New step',
    owner:'', tool:'', mins:0, notes:'' };
  wf.nodes.push(n);
  return n;
}
function findNode(wf, id){ return wf.nodes.find(n => n.id === id); }
function connect(wf, from, to){
  if (from === to || !findNode(wf, from) || !findNode(wf, to)) return null;
  if (wf.edges.some(e => e.from === from && e.to === to)) return null;
  const src = findNode(wf, from);
  let label = '';
  if (src.type === 'decision'){
    const used = wf.edges.filter(e => e.from === from).map(e => e.label);
    label = !used.includes('Yes') ? 'Yes' : (!used.includes('No') ? 'No' : '');
  }
  const e = { id: uid(), from, to, label };
  wf.edges.push(e);
  return e;
}
function removeNode(wf, id){
  wf.nodes = wf.nodes.filter(n => n.id !== id);
  wf.edges = wf.edges.filter(e => e.from !== id && e.to !== id);
}
function removeEdge(wf, id){ wf.edges = wf.edges.filter(e => e.id !== id); }

function makeHistory(limit){
  limit = limit || 100;
  return { undo:[], redo:[],
    push(before){ this.undo.push(before); if (this.undo.length > limit) this.undo.shift(); this.redo = []; },
    back(current){ if (!this.undo.length) return null; this.redo.push(current); return this.undo.pop(); },
    fwd(current){ if (!this.redo.length) return null; this.undo.push(current); return this.redo.pop(); } };
}

function ownerKey(o){ return (o || '').trim().toLowerCase(); }
// Owners get colours in order of first appearance, so no two clash until there are more than 8.
function ownerColors(wf){
  const m = new Map();
  for (const n of wf.nodes){ const k = ownerKey(n.owner); if (k && !m.has(k)) m.set(k, OWNER_COLORS[m.size % OWNER_COLORS.length]); }
  return m;
}
function ownerColor(o, wf){ const k = ownerKey(o); return k ? (ownerColors(wf).get(k) || OWNER_COLORS[0]) : null; }
function summary(wf){
  const steps = wf.nodes.filter(n => n.type === 'step' || n.type === 'decision');
  const owners = new Map(), tools = new Map();
  let total = 0;

    box.appendChild(h('p', { className:'muted', text: (a.title || '?') + ' → ' + (b.title || '?'), style:'margin-bottom:10px' }));
    box.appendChild(field('Label (e.g. Yes / No)', e.label, v => e.label = v, { max:40, id: p + 'fLabel' }));
    const row = h('div', { className:'row' });
    const flip = h('button', { text:'Reverse' });
    flip.onclick = () => change(() => { const t = e.from; e.from = e.to; e.to = t; });
    const del = h('button', { className:'danger', text:'Delete arrow' });
    del.onclick = deleteSel;
    row.append(flip, del); box.appendChild(row);
  } else {
    box.appendChild(h('h2', { text:'Details' }));
    box.appendChild(h('p', { className:'muted', text:'Click a shape to say who does it, with what, and how long it takes. Drag its blue square to connect it to the next one.' }));
  }
}
function renderSummary(){
  const box = $('summary'); box.textContent = '';
  const s = summary(wf);
  $('tbSteps').textContent = String(s.steps); $('tbTime').textContent = fmtMins(s.total);
  box.appendChild(h('h2', { text:'Who does what' }));
  if (!s.owners.length) box.appendChild(h('p', { className:'muted', text:'Add steps and name their owners to see the time each person carries.' }));
  if (s.owners.length){
    for (const o of s.owners){
      const c = ownerColor(o.name, wf);
      const name = h('span', {}, [h('span', { className:'dot', style:'background:' + (o.key ? c : '#C7C7CC') }), document.createTextNode(o.name + ' (' + o.count + ')')]);
      box.appendChild(h('div', { className:'stat' }, [name, h('b', { text: fmtMins(o.mins) })]));
    }
  }
  if (s.tools.length){
    box.appendChild(h('h2', { text:'Tools used', style:'margin-top:14px' }));
    box.appendChild(h('p', { className:'muted', text: s.tools.join(', ') }));
  }
  if (wf.nodes.some(n => n.type === 'decision')) box.appendChild(h('p', { className:'muted', style:'margin-top:12px;color:var(--ink-faint)', text:'Total time adds up every step. One run follows only one branch of a decision, so a real run takes less.' }));
}
function renderList(){
  const sl = $('wfList'); sl.textContent = '';
  const ids = Object.keys(store.items).sort((a,b) => store.items[b].updated - store.items[a].updated);
  const mine = h('optgroup', { label:'My workflows' }), tpl = h('optgroup', { label:'Start from a template' });
  for (const id of ids) mine.appendChild(h('option', { value:id, text: store.items[id].data.name, selected: id === store.current }));
  for (const [k, label] of TEMPLATES) tpl.appendChild(h('option', { value:'tpl:' + k, text:label }));
  sl.append(mine, tpl);
  $('tbName').textContent = wf.name;
  if (document.activeElement !== $('wfName')) $('wfName').value = wf.name;
  $('bDel').textContent = delArmed ? 'Sure?' : 'Delete';
}

// ---- workflows list
function openItem(id){ store.current = id; wf = store.items[id].data; hist = makeHistory(); sel = null; persist(); render(); fit(); }
function addItem(data){ const id = uid(); store.items[id] = { data, updated: Date.now() }; openItem(id); }
let delArmed = false, delT;
$('wfList').onchange = e => {
  const v = e.target.value;
  if (v.startsWith('tpl:')){ addItem(template(v.slice(4))); toast('Template opened as a new workflow'); }
  else openItem(v);
};
$('bNew').onclick = () => { const w = emptyWorkflow(); addNode(w, 'start', 0, 0); addItem(w); };
$('bDup').onclick = () => { const w = JSON.parse(JSON.stringify(wf)); w.name = (w.name + ' (copy)').slice(0, LIMITS.name); addItem(w); toast('Duplicated'); };
$('bDel').onclick = () => {
  if (!delArmed){ delArmed = true; renderList(); clearTimeout(delT); delT = setTimeout(() => { delArmed = false; renderList(); }, 3000); return; }
  delArmed = false;
  delete store.items[store.current];
  const ids = Object.keys(store.items);
  if (!ids.length){ const w = emptyWorkflow(); addNode(w, 'start', 0, 0); addItem(w); }
  else openItem(ids.sort((a,b) => store.items[b].updated - store.items[a].updated)[0]);
  toast('Workflow deleted');
};
let nameBefore = null;
$('wfName').addEventListener('focus', () => { nameBefore = JSON.stringify(wf); });
$('wfName').addEventListener('input', e => { wf.name = e.target.value.slice(0, LIMITS.name) || 'Untitled workflow'; persist(); renderList(); });
$('wfName').addEventListener('change', () => { if (nameBefore && JSON.stringify(wf) !== nameBefore) hist.push(nameBefore); render(); });

// ---- selection + delete
function deleteSel(){
  if (!sel) return;
  const s = sel; sel = null;
  change(() => s.kind === 'node' ? removeNode(wf, s.id) : removeEdge(wf, s.id));
}
function focusName(){
  if (narrow()){ if (sel) openCtx(0, 0, true); return; } // small screens: edit in the sheet, not the drawer
  if (app.classList.contains('collapsed')) setSidebar(true); const f = $('fTitle') || $('fLabel'); if (f){ f.focus(); f.select(); } }

// ---- collapsible sidebar
const SB_KEY = 'wfd.sidebar';
const narrow = () => window.matchMedia('(max-width:900px)').matches;
function setSidebar(open){
  const was = !app.classList.contains('collapsed');
  if (was === open) return;
  app.classList.toggle('collapsed', !open);
  // keep the drawing where it is on screen while the canvas grows or shrinks
  if (!narrow()){ const w = $('sidebar').getBoundingClientRect().width || 280; view.x += open ? -w : w; applyView(); }
  try { localStorage.setItem(SB_KEY, open ? 'open' : 'closed'); } catch(e){}
}
$('sbClose').onclick = () => setSidebar(false);
$('sbOpen').onclick = () => setSidebar(true);
$('scrim').onclick = () => setSidebar(false);
$('selEdit').onclick = () => { if (sel) openCtx(innerWidth / 2 - 125, 90, false); };

// ---- canvas pointer handling
let drag = null, lastTap = { id:null, t:0 };
// touch: two fingers pinch-zoom and pan; a long press opens the same menu as a right-click
const pts = new Map(); let pinch = null, lp = null;
function clearLp(){ if (lp){ clearTimeout(lp.t); lp = null; } }
function cancelDrag(){
  clearLp();
  if (drag && drag.mode === 'move' && drag.moved){ hist.push(drag.before); persist(); }
  drag = null; tempLine.setAttribute('visibility', 'hidden'); cv.classList.remove('panning');
}
function pinchState(){
  const [a, b] = [...pts.values()];
  return { d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}
cv.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  if (e.isPrimary) pts.clear();
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pts.size >= 2){
    cv.setPointerCapture(e.pointerId); cancelDrag();
    if (pts.size === 2){ const s = pinchState(), r = cv.getBoundingClientRect(); pinch = { d:s.d, k:view.k, wx:(s.mx - r.left - view.x)/view.k, wy:(s.my - r.top - view.y)/view.k }; }
    return;
  }
  const p = toWorld(e.clientX, e.clientY);
  const handle = e.target.closest('[data-handle]'), nodeEl = e.target.closest('[data-node]'), edgeEl = e.target.closest('[data-edge]');
  cv.setPointerCapture(e.pointerId);
  if (e.pointerType !== 'mouse' && !handle){
    const nid = nodeEl && nodeEl.getAttribute('data-node'), eid = edgeEl && edgeEl.getAttribute('data-edge'), x = e.clientX, y = e.clientY;
    lp = { x, y, t: setTimeout(() => { lp = null; cancelDrag(); menuAt(nid, eid, x, y); }, 520) };
  }
  if (handle){
    const n = findNode(wf, handle.getAttribute('data-handle'));
    drag = { mode:'connect', from:n.id };
    tempLine.setAttribute('x1', n.x); tempLine.setAttribute('y1', n.y + SIZE[n.type].h/2);
    tempLine.setAttribute('x2', p.x); tempLine.setAttribute('y2', p.y); tempLine.setAttribute('visibility', 'visible');
  } else if (nodeEl){
    const id = nodeEl.getAttribute('data-node'), n = findNode(wf, id);
    const now = Date.now(), dbl = lastTap.id === id && now - lastTap.t < 400;
    lastTap = { id, t: now };
    sel = { kind:'node', id }; render();
    if (dbl){ drag = null; focusName(); return; }
    drag = { mode:'move', id, dx: p.x - n.x, dy: p.y - n.y, before: JSON.stringify(wf), moved:false };
  } else if (edgeEl){
    const id = edgeEl.getAttribute('data-edge');
    const now = Date.now(), dbl = lastTap.id === id && now - lastTap.t < 400;
    lastTap = { id, t: now };
    sel = { kind:'edge', id }; render(); drag = null;
    if (dbl) focusName();
  } else {
    if (sel){ sel = null; render(); }
    drag = { mode:'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
    cv.classList.add('panning');
  }
});
cv.addEventListener('pointermove', e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch){
    if (pts.size >= 2){
      const s = pinchState(), r = cv.getBoundingClientRect();
      view.k = Math.max(0.2, Math.min(3, pinch.k * s.d / pinch.d));
      view.x = s.mx - r.left - pinch.wx * view.k; view.y = s.my - r.top - pinch.wy * view.k; applyView();
    }
    return;
  }
  if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 8) clearLp();
  if (!drag) return;
  if (drag.mode === 'pan'){ view.x = drag.vx + e.clientX - drag.sx; view.y = drag.vy + e.clientY - drag.sy; applyView(); return; }
  const p = toWorld(e.clientX, e.clientY);
  if (drag.mode === 'move'){
    const n = findNode(wf, drag.id), nx = snap(p.x - drag.dx), ny = snap(p.y - drag.dy);
    if (nx !== n.x || ny !== n.y){ n.x = nx; n.y = ny; drag.moved = true; redraw(); }
  } else if (drag.mode === 'connect'){
    tempLine.setAttribute('x2', p.x); tempLine.setAttribute('y2', p.y);
  }
});
function endDrag(e){
  pts.delete(e.pointerId); clearLp();
  if (pinch){ if (pts.size < 2) pinch = null; drag = null; return; }
  if (!drag) return;
  const d = drag; drag = null;
  cv.classList.remove('panning');
  if (d.mode === 'move' && d.moved){ hist.push(d.before); persist(); render(); }
  if (d.mode === 'connect'){
    tempLine.setAttribute('visibility', 'hidden');
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const nodeEl = t && t.closest && t.closest('[data-node]');
    if (nodeEl){
      let made = null;
      change(() => { made = connect(wf, d.from, nodeEl.getAttribute('data-node')); });
      if (made){ sel = { kind:'edge', id: made.id }; render(); }
    } else {
      // dropped on empty canvas: create a new step there, connected
      const p = toWorld(e.clientX, e.clientY);
      let n;
      change(() => { n = addNode(wf, 'step', p.x, p.y); connect(wf, d.from, n.id); });
      sel = { kind:'node', id: n.id }; render(); focusName();
    }
  }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; cancelDrag(); });
cv.addEventListener('contextmenu', e => {
  e.preventDefault();
  const nodeEl = e.target.closest('[data-node]'), edgeEl = e.target.closest('[data-edge]');
  cancelDrag();
  menuAt(nodeEl && nodeEl.getAttribute('data-node'), edgeEl && edgeEl.getAttribute('data-edge'), e.clientX, e.clientY);
});
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX, e.clientY); }, { passive:false });
$('zIn').onclick = () => zoomAt(1.2); $('zOut').onclick = () => zoomAt(1/1.2); $('zFit').onclick = fit;

// ---- palette: drag in, or tap to add at centre
let ghost = null;
document.querySelectorAll('.pal').forEach(p => {
  p.addEventListener('pointerdown', e => {
    e.preventDefault(); p.setPointerCapture(e.pointerId);
    ghost = { type: p.dataset.type, sx: e.clientX, sy: e.clientY, moved:false };
  });
  p.addEventListener('pointermove', e => { if (ghost && Math.hypot(e.clientX - ghost.sx, e.clientY - ghost.sy) > 6){ ghost.moved = true; p.style.opacity = .5; } });
  p.addEventListener('pointerup', e => {
    if (!ghost) return;
    const g = ghost; ghost = null; p.style.opacity = '';
    const r = cv.getBoundingClientRect();
    let cx = e.clientX, cy = e.clientY;
    const inside = cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
    if (g.moved && !inside) return;
    if (!g.moved){ // tap: place below the selected shape, or at the view centre
      const s = sel && sel.kind === 'node' && findNode(wf, sel.id);
      let n;
      if (s){ change(() => { n = addNode(wf, g.type, s.x, s.y + 120); if (s.type !== 'end') connect(wf, s.id, n.id); }); }
      else { const c = toWorld(r.left + r.width/2, r.top + r.height/2); change(() => { n = addNode(wf, g.type, c.x, c.y); }); }
      sel = { kind:'node', id:n.id }; render();
      if (narrow()) setSidebar(false); // phone drawer covers the canvas, so get out of the way
      return;
    }
    const w = toWorld(cx, cy);
    let n; change(() => { n = addNode(wf, g.type, w.x, w.y); });
    sel = { kind:'node', id:n.id }; render();
  });
});

// ---- keyboard
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z' && !typing){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y' && !typing){ e.preventDefault(); redo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && !typing && sel){ e.preventDefault(); deleteSel(); }
  else if (e.key === 'Escape' && ctx.classList.contains('show')){ closeCtx(); document.activeElement.blur(); }
  else if (e.key === 'Escape' && !typing && sel){ sel = null; render(); }
  else if (e.key === 'Enter' && !typing && sel){ e.preventDefault(); focusName(); }
  else if (e.key === '[' && !typing && !mod){ e.preventDefault(); setSidebar(app.classList.contains('collapsed')); }
});
$('bUndo').onclick = undo; $('bRedo').onclick = redo;

// ---- file save / open
function fileName(ext){ return (wf.name || 'workflow').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase().slice(0, 60) + ext; }
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function jsonText(){ return JSON.stringify(validate(wf), null, 2); }
$('bSave').onclick = () => { download(new Blob([jsonText()], { type:'application/json' }), fileName('.json')); toast('Saved ' + fileName('.json') + ' to your downloads'); };
async function openFile(f){
  if (!f) return;
  if (f.size > 2000000){ toast('That file is too big to be a workflow'); return; }
  try { addItem(validate(JSON.parse(await f.text()))); toast('Opened ' + f.name); }
  catch(err){ toast('Could not open that file: ' + err.message); }
}
$('fileIn').onchange = e => { openFile(e.target.files[0]); e.target.value = ''; };
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ dragDepth++; $('drop').classList.add('show'); } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0){ dragDepth = 0; $('drop').classList.remove('show'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('drop').classList.remove('show'); openFile(e.dataTransfer.files[0]); });

// ---- share link
async function shareUrl(){ return location.href.split('#')[0] + '#w=' + await encodeShare(wf); }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e){}
  try { // older browsers, or the page is not allowed to use the clipboard
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch(e){ return false; }
}
function showLink(url){ // could not copy for them: show the link so they can copy it by hand
  ctx.textContent = ''; ctx.dataset.id = '';
  ctx.appendChild(h('h2', { text:'Share link' }));
  ctx.appendChild(h('p', { className:'muted', style:'margin-bottom:8px', text:'Your browser would not copy it for you. Copy it from here (Ctrl+C):' }));
  const inp = h('input', { value:url, readOnly:true }); ctx.appendChild(inp);
  placeCtx(innerWidth / 2 - 125, 80); inp.focus(); inp.select();
}
$('bShare').onclick = async () => {
  let url;
  try { url = await shareUrl(); } catch(e){ toast('Could not make a share link: ' + e.message); return; }
  if (!await copyText(url)){ showLink(url); return; }
  if (url.length > 8000) toast('Link copied, but it is very long (' + url.length + ' characters). Some apps cut long links; Save file is safer.', 6000);
  else toast('Share link copied. Anyone who opens it gets their own copy.');
};

// ---- PNG export
function exportSvg(){
  const b = bounds(wf), pad = 40;
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('xmlns', SVGNS);
  s.setAttribute('viewBox', `${b.x - pad} ${b.y - pad - 40} ${b.w + pad*2} ${b.h + pad*2 + 40}`);
  s.setAttribute('width', b.w + pad*2); s.setAttribute('height', b.h + pad*2 + 40);
  s.appendChild(cv.querySelector('defs').cloneNode(true));
  el('rect', { x:b.x - pad, y:b.y - pad - 40, width:b.w + pad*2, height:b.h + pad*2 + 40, fill:PAPER }, s);
  const t = el('text', { x:b.x - pad + 20, y:b.y - pad - 8, fill:INK, 'font-size':18, 'font-weight':700, 'font-family':FONT }, s);
  t.textContent = wf.name;
  const eg = el('g', {}, s), ng = el('g', {}, s);
  for (const e of wf.edges) drawEdge(e, eg, true);
  for (const n of wf.nodes) drawNode(n, ng, true);
  return s;
}
function makePng(){
  return new Promise((resolve, reject) => {
    const s = exportSvg(), w = +s.getAttribute('width'), hh = +s.getAttribute('height');
    const scale = Math.min(2, 8000 / Math.max(w, hh)); // very large drawings: stay under the browser's canvas size limit
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = Math.round(w*scale); c.height = Math.round(hh*scale);
      const g = c.getContext('2d'); g.scale(scale, scale); g.drawImage(img, 0, 0, w, hh);
      c.toBlob(bl => bl ? resolve(bl) : reject(new Error('empty picture')), 'image/png');
    };
    img.onerror = () => reject(new Error('picture failed'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(s));
  });
}
$('bPng').onclick = () => makePng().then(bl => { download(bl, fileName('.png')); toast('Picture saved to your downloads'); },
  () => toast('Could not make the picture in this browser'));
// Printing (button or Ctrl+P): light canvas, nothing selected, and the whole drawing scaled to fit the page.
let printWasDark = false;
window.addEventListener('beforeprint', () => {
  printWasDark = darkCv; sel = null; closeCtx(); if (darkCv) applyTheme(false, true); render();
  const b = bounds(wf), pad = 40;
  cv.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.w + pad*2} ${b.h + pad*2}`); world.setAttribute('transform', '');
});
window.addEventListener('afterprint', () => { cv.removeAttribute('viewBox'); if (printWasDark) applyTheme(true, true); render(); });
$('bPrint').onclick = () => window.print();

// ---- agent API: everything the buttons do, callable from a script or a browser agent
function patch(n, f){
  for (const k of ['title','owner','tool']) if (k in f) n[k] = str(String(f[k]), LIMITS.text);
  if ('notes' in f) n.notes = str(String(f.notes), LIMITS.notes);
  if ('mins' in f) n.mins = Math.max(0, Math.min(100000, num(f.mins)));
}
window.OpsFlow = {
  version: 1,
  help: 'OpsFlow agent API (window.OpsFlow). get() -> {name,nodes,edges}. load(workflow) opens it as a new workflow and returns it; a node is {id, type: start|step|decision|end, title, owner, tool, mins, notes, next:[id or {to,label}]}; leave out x and y and the layout is done for you. add(node, afterId) -> id. update(id, fields). remove(id). connect(from, to, label) -> arrow id. rename(name). tidy() re-does the layout. summary() -> steps, total minutes, time per owner, tools. json() -> file text. shareLink() -> Promise<url>. png() -> Promise<Blob>. No page needed: any URL ending in #w=j.<URL-encoded workflow JSON> opens that workflow.',
  get: () => JSON.parse(JSON.stringify(wf)),
  load(obj){ addItem(validate(typeof obj === 'string' ? JSON.parse(obj) : obj)); return this.get(); },
  add(node, afterId){
    node = node || {};
    const a = afterId && findNode(wf, afterId), b = bounds(wf);
    let n;
    change(() => {
      n = addNode(wf, TYPES.includes(node.type) ? node.type : 'step', a ? a.x : 0, a ? a.y + 120 : (wf.nodes.length ? b.y + b.h + 80 : 0));
      patch(n, node); if (a) connect(wf, a.id, n.id);
    });
    return n.id;
  },
  update(id, fields){ const n = findNode(wf, id); if (!n) return false; change(() => patch(n, fields || {})); return true; },
  remove(id){ if (!findNode(wf, id)) return false; change(() => removeNode(wf, id)); return true; },
  connect(from, to, label){ let e; change(() => { e = connect(wf, from, to); if (e && label !== undefined) e.label = str(String(label), 40); }); return e ? e.id : null; },
  rename(name){ change(() => { wf.name = str(String(name), LIMITS.name) || 'Untitled workflow'; }); return wf.name; },
  tidy(){ change(() => autoLayout(wf)); fit(); },
  summary: () => summary(wf),
  json: () => jsonText(),
  shareLink: () => shareUrl(),
  png: () => makePng()
};

// ---- start-up: share link / #sample / saved work
async function boot(){
  const hash = location.hash;
  render(); fit();
  if (hash.startsWith('#w=')){
    try { const w = await decodeShare(hash.slice(3)); w.name = (w.name + ' (shared)').slice(0, LIMITS.name); addItem(w); toast('Opened a shared workflow as your own copy'); }
    catch(err){ toast('That share link is broken or incomplete'); }
    history.replaceState(null, '', location.pathname + location.search);
  } else if (hash === '#sample'){
    addItem(template('onboarding'));
    history.replaceState(null, '', location.pathname + location.search);
  }
  window.__ready = true;
}
window.addEventListener('resize', () => applyView());
boot();
})();
